  <ellipse cx="369" cy="192" rx="3" ry="5"
           transform="rotate(32 369 192)"
           stroke="#77746D" stroke-width="1.5"/>

  <!-- Golden thread from needle -->
  <path d="M369 192 C395 170 404 155 388 148 C376 143 370 156 377 162"
