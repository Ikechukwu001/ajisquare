
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="fabric" x1="120" y1="300" x2="470" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9F5EC"/>
      <stop offset="1" stop-color="#D9CDB9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EAD5A0"/>
      <stop offset=".5" stop-color="#AD8548"/>
      <stop offset="1" stop-color="#E8D19B"/>
    </linearGradient>
    <linearGradient id="skin" x1="190" y1="160" x2="360" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7C2A5"/>
      <stop offset="1" stop-color="#C89572"/>
    </linearGradient>
  </defs>

  <!-- Decorative editorial frame -->
  <circle cx="300" cy="300" r="258" stroke="#B99A66" stroke-opacity=".28"/>
  <circle cx="300" cy="300" r="244" stroke="#B99A66" stroke-opacity=".16" stroke-dasharray="2 9"/>

  <!-- Tailoring scissors -->
  <g stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="130" cy="150" r="22"/>
    <circle cx="166" cy="177" r="22"/>
    <path d="M146 165 L224 232"/>
    <path d="M180 179 L224 232"/>
    <path d="M146 165 L105 96"/>
    <path d="M180 179 L237 119"/>
  </g>
  <circle cx="224" cy="232" r="5" fill="#AD8548"/>

  <!-- Loose thread -->
  <path d="M369 156 C414 128 448 164 424 190 C400 213 376 185 393 169"
        stroke="#B99A66" stroke-width="2" stroke-linecap="round"/>

  <!-- Fabric underneath the hands -->
  <path d="M112 344 L366 268 L493 389 L435 501 L137 470 Z"
