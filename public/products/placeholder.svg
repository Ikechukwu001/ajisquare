
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#102F38"/>
      <stop offset="1" stop-color="#071820"/>
    </linearGradient>
    <linearGradient id="gold" x2="1" y2="1">
      <stop stop-color="#FFF0A6"/>
      <stop offset=".45" stop-color="#D6A33D"/>
      <stop offset="1" stop-color="#805018"/>
    </linearGradient>
    <linearGradient id="pink" x2="1" y2="1">
      <stop stop-color="#FFB8C8"/>
      <stop offset=".5" stop-color="#E65E8A"/>
      <stop offset="1" stop-color="#8D2854"/>
    </linearGradient>
    <linearGradient id="teal" x2="1" y2="1">
      <stop stop-color="#9AF2E5"/>
      <stop offset=".5" stop-color="#259F9B"/>
      <stop offset="1" stop-color="#07545C"/>
    </linearGradient>
    <linearGradient id="silver" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#A8BBC5"/>
      <stop offset="1" stop-color="#526976"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" rx="35" fill="url(#bg)"/>
  <circle cx="600" cy="380" r="310" fill="#1D6670" opacity=".12"/>
  <circle cx="600" cy="380" r="240" stroke="#D6A33D" opacity=".2" stroke-width="2"/>
  <circle cx="600" cy="380" r="275" stroke="#D6A33D" opacity=".12" stroke-dasharray="5 12"/>

  <!-- Decorative stars -->
  <g fill="#FCE6A0">
    <path d="M110 150l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <path d="M1060 170l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
    <path d="M1000 570l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
    <circle cx="260" cy="230" r="4"/>
    <circle cx="920" cy="300" r="5"/>
    <circle cx="160" cy="550" r="4"/>
    <circle cx="780" cy="120" r="4"/>
  </g>

  <!-- Floor shadows -->
  <g fill="#000" opacity=".4" filter="url(#shadow)">
    <ellipse cx="580" cy="680" rx="430" ry="35"/>
    <ellipse cx="200" cy="620" rx="95" ry="20"/>
    <ellipse cx="940" cy="630" rx="100" ry="25"/>
  </g>

  <!-- Mannequin -->
  <g>
    <path d="M555 215 Q535 180 550 155 Q565 135 600 145 Q635 135 650 160 Q665 185 640 220 L655 250 Q690 280 685 360 L670 490 Q600 525 530 490 L515 360 Q510 280 545 250Z"
      fill="url(#pink)" stroke="#FFD3DC" stroke-width="3"/>
    <path d="M555 215 Q600 240 640 215 L655 250 Q600 280 545 250Z" fill="#8D2854" opacity=".55"/>
    <path d="M545 250 Q600 290 655 250 Q685 300 672 380 L655 475 Q600 500 545 475 L528 380 Q515 300 545 250Z"
      fill="url(#pink)"/>
    <path d="M555 275 Q600 315 645 275" stroke="#FFD7E1" stroke-width="4" opacity=".7"/>
    <path d="M535 375 Q600 400 665 375" stroke="#FFD7E1" stroke-width="3" opacity=".5"/>
    <path d="M600 145 L600 115" stroke="url(#gold)" stroke-width="10"/>
    <path d="M580 115 Q600 95 620 115" stroke="url(#gold)" stroke-width="8"/>
    <path d="M565 490 L635 490 L650 535 L550 535Z" fill="url(#gold)"/>
    <path d="M600 535 L600 620" stroke="url(#gold)" stroke-width="12"/>
    <path d="M520 620 L680 620 L700 638 L500 638Z" fill="url(#gold)"/>
    <path d="M570 280 Q600 300 630 280" stroke="#FFF1E9" stroke-width="2" stroke-dasharray="4 5"/>
  </g>

  <!-- Sewing machine -->
  <g transform="translate(90 350)">
    <ellipse cx="120" cy="225" rx="125" ry="15" fill="#000" opacity=".35"/>
    <path d="M25 185 L250 185 L250 210 L25 210Z" fill="url(#silver)"/>
    <path d="M45 185 L45 85 Q45 25 105 25 L195 25 Q235 25 235 75 L235 135 L205 135 L205 85 Q205 55 175 55 L115 55 Q75 55 75 90 L75 185Z"
      fill="url(#teal)" stroke="#B7F5E9" stroke-width="3"/>
    <path d="M75 130 L175 130 L175 165 L75 165Z" fill="#0B4852"/>
    <path d="M75 130 L175 130 L175 140 L75 140Z" fill="#8BE4D7" opacity=".6"/>
    <rect x="90" y="85" width="80" height="10" rx="5" fill="#D4FFF6"/>
    <circle cx="210" cy="105" r="10" fill="url(#gold)"/>
    <circle cx="210" cy="105" r="4" fill="#FFF2BC"/>
    <path d="M125 55 L125 0 L145 0 L145 55" fill="url(#silver)"/>
    <ellipse cx="135" cy="0" rx="18" ry="7" fill="#E4F5F5"/>
    <path d="M135 55 L135 180" stroke="#DCEEF1" stroke-width="3"/>
    <path d="M130 180 L140 180 L135 195Z" fill="url(#gold)"/>
    <path d="M75 165 L180 165" stroke="#FFF" stroke-width="4"/>
    <path d="M55 185 L225 185" stroke="#E5FFFF" stroke-width="3"/>
    <circle cx="190" cy="170" r="5" fill="#FFD56A"/>
  </g>

  <!-- Scissors -->
  <g transform="translate(835 345) rotate(-25)">
    <ellipse cx="0" cy="30" rx="27" ry="35" stroke="url(#gold)" stroke-width="13"/>
    <ellipse cx="0" cy="110" rx="27" ry="35" stroke="url(#gold)" stroke-width="13"/>
    <path d="M0 60 L105 0 L120 5 L15 85Z" fill="url(#silver)" stroke="#EAF5FF" stroke-width="2"/>
    <path d="M0 80 L105 145 L120 140 L15 55Z" fill="url(#silver)" stroke="#EAF5FF" stroke-width="2"/>
    <circle cx="8" cy="70" r="11" fill="url(#gold)" stroke="#FFF0A6" stroke-width="3"/>
    <path d="M105 0 L120 5 M105 145 L120 140" stroke="#FFF" stroke-width="3"/>
  </g>

  <!-- Thread spools -->
  <g transform="translate(850 550)">
    <ellipse cx="65" cy="110" rx="65" ry="15" fill="#000" opacity=".3"/>
    <path d="M25 10 L105 10 L95 110 L35 110Z" fill="url(#pink)"/>
    <path d="M25 10 L105 10 L100 25 L30 25Z" fill="#FFC3D2"/>
    <path d="M35 110 L95 110 L105 125 L25 125Z" fill="url(#gold)"/>
    <path d="M35 38 L95 38 M34 48 L96 48 M33 58 L97 58 M32 68 L98 68 M31 78 L99 78 M30 88 L100 88"
      stroke="#FFE0E7" stroke-width="3" opacity=".7"/>
  </g>

  <g transform="translate(980 525)">
    <ellipse cx="40" cy="120" rx="45" ry="12" fill="#000" opacity=".3"/>
    <path d="M10 15 L70 15 L65 110 L15 110Z" fill="url(#teal)"/>
    <path d="M10 15 L70 15 L65 28 L15 28Z" fill="#C0FFF2"/>
    <path d="M15 110 L65 110 L72 122 L8 122Z" fill="url(#gold)"/>
    <path d="M15 45 L66 45 M15 55 L65 55 M14 65 L65 65 M14 75 L65 75 M13 85 L64 85"
      stroke="#C7FFF4" stroke-width="3"/>
  </g>

  <!-- Measuring tape -->
  <g transform="translate(230 565) rotate(-12)">
    <path d="M0 55 C-15 -20 140 -30 165 40 C185 100 65 135 30 85 C10 55 65 15 100 45"
      stroke="url(#gold)" stroke-width="25" fill="none" stroke-linecap="round"/>
    <path d="M0 55 C-15 -20 140 -30 165 40 C185 100 65 135 30 85 C10 55 65 15 100 45"
      stroke="#FFF0B0" stroke-width="2" fill="none" stroke-dasharray="5 8"/>
    <path d="M100 45 L125 65" stroke="#FFF" stroke-width="5"/>
  </g>

  <!-- Needle and thread -->
  <g transform="translate(420 550) rotate(25)">
    <path d="M30 0 L30 150" stroke="url(#silver)" stroke-width="5"/>
    <ellipse cx="30" cy="-5" rx="9" ry="15" stroke="url(#gold)" stroke-width="4"/>
    <path d="M30 150 L25 170 L35 170Z" fill="url(#silver)"/>
    <path d="M30 -20 C-25 -65 100 -100 70 -150" stroke="url(#pink)" stroke-width="4" fill="none"/>
  </g>

  <!-- Hanger -->
  <g transform="translate(710 130)">
    <path d="M65 0 Q80 -30 95 -5 Q105 10 85 20 L85 35"
      stroke="url(#gold)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M85 35 L5 110 Q-5 125 15 125 L180 125 Q200 125 185 110 L85 35Z"
      stroke="url(#gold)" stroke-width="10" fill="#D6A33D" fill-opacity=".12" stroke-linejoin="round"/>
    <path d="M15 115 L180 115" stroke="#FFF0A6" stroke-width="3"/>
  </g>

  <!-- Buttons -->
  <g transform="translate(400 690)">
    <circle cx="0" cy="0" r="25" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="16" fill="#9D6B22"/>
    <circle cx="-7" cy="-7" r="3" fill="#FFF"/>
    <circle cx="7" cy="-7" r="3" fill="#FFF"/>
    <circle cx="-7" cy="7" r="3" fill="#FFF"/>
    <circle cx="7" cy="7" r="3" fill="#FFF"/>
  </g>
  <g transform="translate(470 700)">
    <circle cx="0" cy="0" r="20" fill="url(#pink)"/>
    <circle cx="-6" cy="-5" r="3" fill="#FFF"/>
    <circle cx="6" cy="-5" r="3" fill="#FFF"/>
    <circle cx="-6" cy="6" r="3" fill="#FFF"/>
    <circle cx="6" cy="6" r="3" fill="#FFF"/>
  </g>

  <!-- Title -->
  <text x="600" y="65" text-anchor="middle"
    font-family="Georgia,serif" font-size="32"
    letter-spacing="7" fill="#F9D98B">AjiSquare</text>
  <text x="600" y="750" text-anchor="middle"
    font-family="Arial,sans-serif" font-size="17"
    letter-spacing="6" fill="#B9E7DC">CREATIVITY • STYLE • CRAFTSMANSHIP</text>
</svg>
