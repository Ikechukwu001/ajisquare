  <path d="M191 375 C265 406 330 414 435 501"
        stroke="#B9A68C" stroke-width="1.5" stroke-opacity=".7"/>
  <path d="M366 268 C345 337 367 405 435 501"
        stroke="#B9A68C" stroke-width="1.5" stroke-opacity=".7"/>
  <path d="M145 445 C237 454 320 460 435 501"
