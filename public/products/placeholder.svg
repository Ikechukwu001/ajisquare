  <!-- Left sleeve -->
  <path d="M164 176 C189 153 229 163 247 189 L281 254 L228 307 L181 264 C161 242 151 200 164 176Z"
        fill="#34332F"/>
  <path d="M178 177 C201 168 222 183 234 207 L266 261 L242 280 L207 237 C193 221 180 200 178 177Z"
        fill="#494640"/>

  <!-- Right sleeve -->
  <path d="M365 166 C398 164 419 189 422 219 L414 282 L360 294 L345 231 C340 203 345 179 365 166Z"
        fill="#34332F"/>
  <path d="M371 177 C393 178 401 201 399 223 L393 265 L370 271 L362 221 C359 202 361 186 371 177Z"
