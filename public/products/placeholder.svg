  <g stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
    <path d="M429 294 L425 280"/>
    <path d="M443 290 L443 274"/>
    <path d="M456 295 L464 282"/>
  </g>
  <g fill="#E5C995">
    <circle cx="425" cy="279" r="2.5"/>
    <circle cx="443" cy="273" r="2.5"/>
    <circle cx="465" cy="281" r="2.5"/>
  </g>

  <!-- Small decorative sparkles -->
  <g stroke="#B99A66" stroke-width="1.8" stroke-linecap="round">
    <path d="M118 265 V281 M110 273 H126"/>
    <path d="M456 111 V127 M448 119 H464"/>
    <path d="M493 222 V234 M487 228 H499"/>
  </g>

  <!-- Subtle lower accent -->
  <path d="M234 536 H366" stroke="#B99A66" stroke-opacity=".65"/>
  <circle cx="300" cy="536" r="3" fill="#B99A66"/>
