  <!-- Left hand holding fabric -->
  <path d="M226 245
           C219 230 207 218 197 220
           C187 223 195 241 203 252
           L224 286
           C231 299 246 307 260 302
           L284 287
           C294 280 289 267 279 266
           L252 277
           C243 267 234 254 226 245Z"
        fill="url(#skin)" stroke="#B78362" stroke-width="1.5"/>

  <!-- Fingers -->
  <path d="M204 251 C215 263 224 276 233 287"
        stroke="#B78362" stroke-width="2" stroke-linecap="round"/>
  <path d="M214 244 C225 255 236 271 244 283"
        stroke="#B78362" stroke-width="2" stroke-linecap="round"/>
  <path d="M225 238 C237 250 247 264 255 276"
        stroke="#B78362" stroke-width="2" stroke-linecap="round"/>

