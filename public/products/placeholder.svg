  <!-- Right fingers -->
  <path d="M354 226 L367 249" stroke="#B78362" stroke-width="2" stroke-linecap="round"/>
  <path d="M365 220 L378 245" stroke="#B78362" stroke-width="2" stroke-linecap="round"/>

  <!-- Needle -->
  <path d="M323 264 L368 194"
