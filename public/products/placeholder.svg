  <!-- Fine needlework details -->
  <path d="M282 308 L295 317 L308 309 L321 317 L334 308"
        stroke="#B99A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M283 323 L296 332 L309 324 L322 332 L335 323"
        stroke="#B99A66" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>

  <!-- Pin cushion -->
  <ellipse cx="443" cy="326" rx="34" ry="13" fill="#B99A66" fill-opacity=".2"/>
  <path d="M410 305 Q443 280 476 305 L470 328 Q443 346 416 328Z"
        fill="#9A5F51" stroke="#70473D" stroke-width="1.5"/>
  <path d="M416 307 Q443 290 470 307"
